name: NSE Technical Signals Scanner

on:
  schedule:
    # Two fixed checks per day, Mon-Fri (IST -> UTC, IST = UTC+5:30):
    # 10:30 AM IST (05:00 UTC) -- early heads-up / watchlist check.
    # 3:15 PM IST (09:45 UTC) -- near-close check, most relevant for BTST
    # since it reads a nearly-final daily candle (only 15 min of trading left).
    - cron: "0 5 * * 1-5"
    - cron: "45 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nse-technical-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated alert state
        run: |
          git config user.name "nse-technical-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update alert state [skip ci]"
          git push
