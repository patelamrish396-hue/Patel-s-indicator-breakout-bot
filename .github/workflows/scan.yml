name: NSE Technical Signals Scanner

on:
  schedule:
    # Every 30 min, roughly 8:30am-3:35pm IST (03:00-10:05 UTC), Mon-Fri.
    # The script itself double-checks market hours (9:15-15:30 IST) and
    # exits early outside that window, so a little slack here is fine.
    - cron: "0,30 3-9 * * 1-5"
    - cron: "0,30 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nse-technical-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated alert state
        run: |
          git config user.name "nse-technical-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update alert state [skip ci]"
          git push
